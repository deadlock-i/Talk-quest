<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TalkQuest</title>
    <script>
      // Single Page Apps for GitHub Pages — MIT © rafgraph
      // On a 404 (deep link refresh), redirect to the app root with the
      // original path encoded in the query string so index.html can restore it.
      // segmentCount = 1 for project pages (https://user.github.io/TalkQuest/...).
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">TalkQuest</a>…</p>
  </body>
</html>
